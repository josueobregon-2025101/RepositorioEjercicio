<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href=".././css/styleDocumentos.css">
</head>
<body>
    <header>
        <div class="headerDiv">
            <img src="../Images/carpetaIcon.png" class="carpetaIcon">
            <span>Documentos</span>
            <div class="divRight">
               <label for="">user</label>
                   <button class="btnUser" type="button"><img class="imageUser" src="../Images/userIcon.png" >
                   </button>
                
            </div>
        </div>
    </header>
    <div>
        <div class="principio">
            <h1>Gestión de Documentos</h1>
            <span>administra el registro de documentos del sistema</span>
        </div>
        <div class="almacenadorCajas">
            <div class="totalDocs">
                <span class="tituloTotal">Total Documentos</span>
                <span class="TotalInt">0</span>
            </div>
            <div class="ultimoSubido">
                <span class="tituloUS">Ultimo Documento almacenado</span>
                <span class="Nombre">null</span>
            </div>
            <div class="ultimoSubido">
                <span class="tituloUS">Ultimo ID Ingresado</span>
                <span class="TotalInt">0</span>
            </div>
        </div>
        <div class="Acciones">
            <div class="divBusqueda">
                <img src="../Images/buscarIcon.png" alt="">
                <input class="areaBusqueda" type="text" placeholder="Buscar por nombre">
            </div> 
            <input class="buscarId" type="number" min="0" placeholder="Buscar por ID" >
            <button class="botonAgregar">+Agregar</button>

        </div>

    </div>

    
</body>
</html>

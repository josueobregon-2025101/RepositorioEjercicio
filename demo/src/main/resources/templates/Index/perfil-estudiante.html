<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Configuración básica del documento -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Inprax</title>
    
    <!-- Enlace a la hoja de estilos externa para el diseño visual -->
    <link rel="stylesheet" th:href="@{/Styles/perfil-estudiante.css}">
    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script>
        (function() {
            const theme = localStorage.getItem("theme") || "theme-yellow"
            document.documentElement.classList.add(theme)
        })();
    </script>
</head>
<body class="image-bg">

<video id="bgvideo" autoplay muted loop playsinline></video>

<div id="loading-screen">
    <video autoplay muted playsinline id="loading-video"></video>
</div>
    <!-- Contenedor principal que organiza el sidebar y el contenido central -->
    <div class="dashboard">

        <!-- Panel lateral (Sidebar): Menú de navegación fijo -->
        <aside class="sidebar">
            <!-- Contenedor del nombre de la marca/plataforma -->
            <div class="logo">
                <img id="logo" th:src="@{/Images/INPRAX.png}">
            </div>

            <!-- Lista de navegación: Redirigen a las diferentes secciones del sistema -->
            <nav>
                <ul>
                    <li><a th:href="@{/estudiantes/estudiantes/dashboard}"><i class="fas fa-home"></i> Inicio</a></li>
                    <li><a th:href="@{/practicas/practicas}"><i class="fas fa-briefcase"></i> Prácticas disponibles</a></li>
                    <li><a th:href="@{/postulaciones/postulaciones}"><i class="fas fa-file"></i> Mis postulaciones</a></li>
                    <li><a th:href="@{/documentos/documentos}"><i class="fas fa-folder"></i> Mis documentos</a></li>
                    <li><a th:href="@{/estudiantes/estudiantes/perfil}" class="active"><i class="fas fa-user"></i> Perfil</a></li>
                    <li><a th:href="@{/estudiantes/configuracion}"><i class="fas fa-cog"></i> Configuración</a></li>
                    <li><a th:href="@{/login/index}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a></li>
                </ul>
            </nav>

        </aside>

        <!-- Área de contenido principal: Donde se muestra la información dinámica -->
        <main class="main-content">

            <!-- Cabecera del panel: Título y botón de salida -->
            <header class="header">
                <h1>Perfil del Estudiante</h1>
                <!-- Botón que redirige al login o página principal (Cierra la sesión) -->
                <a th:href="@{/login/index}" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>            </header>

            <!-- Contenedor específico para la gestión de información del usuario -->
            <section class="profile-container">

                <!-- Formulario de datos personales -->
                <div class="profile-card">
                    <h2>Información Personal</h2>
                    <!-- Campos de entrada de datos para el usuario -->
                    <form th:object="${Estudiante}" class="profile-form">

                        <div class="form-group">
                            <label for="id">ID Estudiante:</label>
                            <input type="hidden" id="id" th:field="*{idEstudiante}">
                        </div>
                        <div class="form-group">
                            <label >Nombre:</label>
                            <input type="text" type="text" id="nombre" th:field="*{nombre}">
                        </div>

                        <div class="form-group">
                            <label>Apellido</label>
                            <input type="text" type="text" id="apellido" th:field="*{apellido}">
                        </div>

                        <div class="form-group">
                            <label>Teléfono</label>
                            <input type="text" id="telefono" th:field="*{telefono}">
                        </div>

                        <div class="form-group">
                            <label>Grado</label>
                            <input type="text" id="grado" th:field="*{grado}">
                        </div>
                        <div class="form-group">
                            <label>Edad</label>
                            <input type="text" id="edad" th:field="*{edad}">
                        </div>

                        <div class="form-group">
                            <label>Numero de Tutor</label>
                            <input type="text" id="tutortel" th:field="*{tutortel}">
                        </div>

                        <div class="form-group">
                            <label>Institución</label>
                            <input type="text" id="nombreInstitucion" th:field="*{nombreInstitucion}">
                        </div>

                        <div class="form-group">
                            <label>Carrera</label>
                            <input type="text" id="carrera" th:field="*{carrera}">
                        </div>

                        <!-- Botones de acción para gestionar la creación del registro -->
                        <div class="form-actions">
                            <button type="submit" class="btn" onclick="actualizarEstudiante()"><i class="fas fa-save"></i> Guardar Estudiante</button>

                            <a th:href="@{/estudiantes/estudiantes/dashboard}" class="btn-cancel"><i class="fas fa-times"></i>
                                Cancelar</a>
                        </div>
                    </form>
                </div>


            </section>
            <div class="theme-switcher">
                <button data-theme="theme-yellow">🟡</button>
                <button data-theme="theme-purple">🟣</button>
                <button data-theme="theme-cyan-dark">🔵</button>
                <button data-theme="theme-green-dark">🟢</button>
                <button data-theme="theme-blue-light">⚪</button>
            </div>
        </main>
    </div>
<script th:src="@{/Scripts/temas.js}"></script>
<script th:src="@{/Scripts/perfil.js}"></script>
</body>
</html>

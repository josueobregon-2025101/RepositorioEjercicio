<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Configuración básica del documento -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Inprax</title>
    
    <!-- Enlace a la hoja de estilos externa para el diseño visual -->
    <link rel="stylesheet" th:href="@{/Styles/dashboard-estudiante.css}">
    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script>
        (function() {
            const theme = localStorage.getItem("theme") || "theme-yellow"
            document.documentElement.classList.add(theme)
        })();
    </script>
</head>
<body class="image-bg">

<video id="bgvideo" autoplay muted loop playsinline></video>


    <!-- Contenedor principal que organiza el sidebar y el contenido central -->
    <div class="dashboard">

        <!-- Panel lateral (Sidebar): Menú de navegación fijo -->
        <aside class="sidebar">
            <!-- Contenedor del nombre de la marca/plataforma -->
            <div class="logo">
                <img id="logo" th:src="@{/Images/INPRAX.png}">
            </div>

            <!-- Lista de navegación: Redirigen a las diferentes secciones del sistema -->
            <nav>
                <ul>
                    <li><a th:href="@{/estudiantes/estudiantes/dashboard}"><i class="fas fa-home"></i> Inicio</a></li>
                    <li><a th:href="@{/practicas/estudiantes/practicas}"><i class="fas fa-briefcase"></i> Prácticas disponibles</a></li>
                    <li><a th:href="@{/api/postulaciones/postulaciones}"><i class="fas fa-file"></i> Mis postulaciones</a></li>
                    <li><a th:href="@{/documentos}"><i class="fas fa-folder"></i> Mis documentos</a></li>
                    <li><a th:href="@{/estudiantes/estudiantes/perfil}" class="active"><i class="fas fa-user"></i> Perfil</a></li>
                    <li><a th:href="@{/estudiantes/configuracion}"><i class="fas fa-cog"></i> Configuración</a></li>
                    <li><a th:href="@{/login/index}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a></li>
                </ul>
            </nav>

        </aside>

        <!-- Área de contenido principal: Donde se muestra la información dinámica -->
        <main class="main-content">

            <!-- Cabecera del panel: Título y botón de salida -->
            <header class="header">
                <h1>Perfil del Estudiante</h1>
                <!-- Botón que redirige al login o página principal (Cierra la sesión) -->
                <a th:href="@{/login/index}" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>            </header>

            <section class="profile-container">
                <!-- CONTENEDOR DE LOS DOS FORMULARIOS -->
                <div class="profile-grid" style="display:flex">
                    <!-- Formulario de datos personales -->
                    <div class="profile-card">
                        <h2>Información Usuario</h2>

                        <form class="profile-form">

                            <div class="form-group">
                                <label for="nombre">Nombre:</label>
                                <input type="text" id="nombre" value="Juan">
                            </div>
                    <div class="form-group">
                        <label>Apellido</label>
                        <input type="text" value="Pérez">
                    </div>
                    <div class="form-group">
                        <label>Correo</label>
                        <input type="email" value="juan@email.com">
                    </div>
                    <div class="form-group">
                     <label>Teléfono</label>
                        <input type="text" value="5555-5555">
                    </div>
                    <div class="form-group">
                        <label>Institución</label>
                        <input type="text" value="Instituto Técnico">
                    </div>
                    <div class="form-group">
                        <label>Carrera</label>
                        <input type="text" value="Desarrollo de Software">
                    </div>
                    </form>
        </div>

    <!-- NUEVO FORMULARIO DE DATOS DEL ESTUDIANTE -->
    <div class="profile-card">
        <h2>Datos del Estudiante</h2>

        <form class="profile-form">

            <div class="form-group">
                <label>Carnet</label>
                <input type="text" value="20250001">
            </div>

            <div class="form-group">
                <label>Grado</label>
                <input type="text" value="5to Perito">
            </div>

            <div class="form-group">
                <label>Sección</label>
                <input type="text" value="IN5CM">
            </div>

            <div class="form-group">
                <label>Promedio</label>
                <input type="text" value="85">
            </div>

            <div class="form-group">
                <label>Estado</label>
                <input type="text" value="Activo">
            </div>
                   <div class="form-group">
                       <label>Horas de práctica</label>
                    <input type="text" value="120">
                </div>
                </form>
    </div>
            </section>
            <!-- Botones de acción para gestionar la edición de datos -->
            <div style="display:block">
                <!-- boton para cancelar editar-->
                <div class="form-actions">
                    <button type="button" class="btn-cancel" th:onclick="@{/estudiantes/estudiantes/dashboard}"><i
                            class="fas fa-close"></i> Cancelar</button>
                </div>
                <!-- Botones de acción para gestionar la creación del editar -->
                <div class="form-actions">
                    <button type="button" class="btn" onclick="actualizarEstudiante()"><i class="fas fa-save"></i>
                        Editar</button>
                </div>
            </div>
            <div class="theme-switcher">
                <button data-theme="theme-yellow">🟡</button>
                <button data-theme="theme-purple">🟣</button>
                <button data-theme="theme-cyan-dark">🔵</button>
                <button data-theme="theme-green-dark">🟢</button>
                <button data-theme="theme-blue-light">⚪</button>
            </div>
        </main>
    </div>
<script th:src="@{/Scripts/temas.js}"></script>
<script th:src="@{/Scripts/perfil.js}"></script>
</body>
</html>

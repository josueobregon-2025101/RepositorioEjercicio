<body class="image-bg">

    <!-- Video de fondo -->
    <video id="bgvideo" autoplay muted loop playsinline></video>

    <div id="loading-screen">
        <video autoplay muted playsinline id="loading-video">
        </video>
    </div>

<div class="dashboard">

        <!-- Panel lateral (Sidebar): Menú de navegación fijo -->
        <aside class="sidebar">
            <div class="logo">
                <img id="logo" th:src="@{/Images/INPRAX.png}">
            </div>

        <nav>
                <ul>
                    <li>
                        <a th:href="@{/estudiantes/estudiantes/dashboard}">
                            <i class="fas fa-home"></i> Inicio
                        </a>
                    </li>

                    <li>
                        <a th:href="@{/practicas/estudiantes/practicas}">
                            <i class="fas fa-briefcase"></i> Prácticas disponibles
                        </a>
                    </li>

                    <li>
                        <a th:href="@{/api/postulaciones/postulaciones}">
                            <i class="fas fa-file"></i> Mis postulaciones
                        </a>
                    </li>
                    
                    <li><a th:href="@{/documentos}" class="active"><i class="fas fa-folder"></i>Mis documentos</a></li>
                    
                    <li>
                        <a th:href="@{/estudiantes/estudiantes/perfil}">
                            <i class="fas fa-user"></i> Perfil
                        </a>
                    </li>
                    <li>
                        <a th:href="@{/estudiantes/configuracion}">
                            <i class="fas fa-cog"></i> Configuración
                        </a>
                    </li>
                    <li><a th:href="@{/login/index}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a></li>
                </ul>
            </nav>
        </aside>
    <main class="main-content">

        <header class="header">
            <h1>Mis documentos</h1>
        </header>

        <div class="container">

    <form class="upload-form"
          th:action="@{/documentos/subir}"
          method="post"
          enctype="multipart/form-data">

        <input type="hidden" name="idEstudiante" value="1">

        <select name="tipoDoc" required>
            <option value="">Tipo de documento</option>
            <option value="CV">CV</option>
            <option value="Carta">Carta</option>
            <option value="Portafolio">Portafolio</option>
            <option value="Certificados">Certificados</option>
        </select>

        <input type="file" name="file" required>

        <button type="submit" class="btn btn-subir">Subir</button>

    </form>

    <div class="documentos">

        <div class="cardDocumento" th:each="doc : ${documentos}">

            <div class="cardHeader">
                <h3 th:text="${doc.nombreArchivo}"></h3>
                <span th:text="${doc.fechaSubida}"></span>
            </div>

            <p th:text="${doc.tipoDoc}"></p>

            <div class="acciones">

                <span class="btn btn-ver">
                    <i class="fas fa-eye"></i> Ver
                </span>

                <span class="btn btn-descargar">
                    <i class="fas fa-download"></i> Descargar
                </span>

                <span class="btn btn-reemplazar">
                    <i class="fas fa-sync"></i> Reemplazar
                </span>

            </div>

        </div>

    </div>

</div>

    </main>
</div>

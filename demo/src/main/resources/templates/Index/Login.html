<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Configuración básica del documento -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  
  <!-- Enlace a la hoja de estilos externa para el diseño visual -->
  <link rel="stylesheet" href="../styles/login.css">
</head>
<body>

<!-- Fondo visual de la página -->
<div class="background"></div>

<!-- Contenedor principal que organiza el diseño central y el efecto de borde animado -->
<div class="container">
  <!-- Caja de inicio de sesión: Estilos visuales y profundidad -->
  <div class="login-box">
    <!-- Formulario de acceso para el inicio de sesión -->
    <form class="form">
      
      <!-- Contenedor del nombre de la marca/plataforma -->
      <div class="logouser">
        <img src="../Images/login.png" alt="Logo INPRAX">
      </div>
      
      <!-- Cabecera del panel: Título del formulario -->
      <div class="header">Iniciar sesión</div>

      <!-- Campos de entrada de datos para el usuario -->
      <input type="email" id="email" class="input" placeholder="Correo electrónico" required>
      <input type="password" id="password" class="input" placeholder="Contraseña" required>

      <!-- Botón de acción principal para enviar el formulario -->
      <button type="submit" class="button sign-in">Iniciar sesión</button>

      <!-- Pie de página: Enlace para usuarios que no tienen cuenta -->
      <div class="footer">
        ¿No tienes cuenta?
        <a href="register.html" class="link">Crear cuenta</a>
      </div>
    </form>
  </div>
</div>

<!-- Enlace al script externo para la lógica de autenticación -->
<script src="../Scripts/login.js"></script>
</body>
</html>

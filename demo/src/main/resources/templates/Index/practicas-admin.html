<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderación de Prácticas</title>
    <link rel="stylesheet" th:href="@{/Styles/dashboard-admin.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

        <script>
        (function() {
            const theme = localStorage.getItem("theme") || "theme-yellow"
            document.documentElement.classList.add(theme)
        })();
        </script>

</head>
<body class="image-bg">

    <video id="bgvideo" autoplay muted loop playsinline></video>

<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">
            <img id="logo" th:src="@{/Images/INPRAX.png}">
        </div>
        <nav>
            <ul>
                <li><a th:href="@{/dashboard-admin}"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a th:href="@{/estudiantes}"><i class="fas fa-user-graduate"></i> Estudiantes</a></li>
                <li><a th:href="@{/empresas}"><i class="fas fa-building"></i> Empresas</a></li>
                <li><a th:href="@{/practicas-admin}" class="active"><i class="fas fa-briefcase"></i> Prácticas</a></li>
                <li><a th:href="@{/perfil-admin}"><i class="fas fa-user"></i> Perfil</a></li>
                <li><a th:href="@{/login/index}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Main content -->
    <main class="main-content">
        <header class="header">
            <h1>Moderación de Prácticas</h1>
            <a th:href="@{/login/index}" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
        </header>

        <!-- Botón agregar práctica -->
        <div class="actions">
            <a th:href="@{/practicas/agregar}" class="btn"><i class="fas fa-plus"></i> Agregar Práctica</a>
        </div>

        <!-- Tabla de prácticas -->
        <div class="table-container">
            <table class="table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Empresa</th>
                    <th>Estudiante</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <!-- Iteración dinámica con Thymeleaf -->
                <tr th:each="practica : ${practicas}">
                    <td th:text="${practica.id}">1</td>
                    <td th:text="${practica.titulo}">Título</td>
                    <td th:text="${practica.empresa}">Empresa</td>
                    <td th:text="${practica.estudiante}">Estudiante</td>
                    <td th:text="${practica.estado}">Estado</td>
                    <td>
                        <a th:href="@{/practicas/editar/{id}(id=${practica.id})}" class="action-btn edit"><i class="fas fa-edit"></i></a>
                        <a th:href="@{/practicas/aprobar/{id}(id=${practica.id})}" class="action-btn accept"><i class="fas fa-check"></i></a>
                        <a th:href="@{/practicas/rechazar/{id}(id=${practica.id})}" class="action-btn reject"><i class="fas fa-times"></i></a>
                        <form th:action="@{/practicas/eliminar/{id}(id=${practica.id})}" method="post" style="display:inline;">
                            <button type="submit" class="action-btn delete"><i class="fas fa-trash-alt"></i></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

    <script th:src="@{/Scripts/temas.js}"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderación de Prácticas</title>
    <link rel="stylesheet" th:href="@{/Styles/dashboard-admin.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="dashboard">
    <aside class="sidebar">
        <div class="logo">
            <img th:src="@{/Images/INPRAX.png}">
        </div>
        <nav>
            <ul>
                <li><a th:href="@{/admin/dashboard}"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a th:href="@{/admin/estudiantes}"><i class="fas fa-user-graduate"></i> Estudiantes</a></li>
                <li><a th:href="@{/admin/empresas}"><i class="fas fa-building"></i> Empresas</a></li>
                <li><a th:href="@{/admin/practicas}" class="active"><i class="fas fa-briefcase"></i> Prácticas</a></li>
                <li><a th:href="@{/admin/perfil}"><i class="fas fa-user"></i> Perfil</a></li>
                <li><a th:href="@{/logout}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a></li>
                <div class="actions">
                    <a th:href="@{/admin/practicas/agregar}" class="btn">
                        <i class="fas fa-plus"></i> Agregar Práctica
                    </a>
                </div>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        <header class="header">
            <h1>Moderación de Prácticas</h1>
            <a th:href="@{/logout}" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
        </header>

        <div class="table-container">
            <table class="table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Empresa</th>
                    <th>Tipo</th>
                    <th>Vigencia</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="practica : ${practicas}">
                    <td th:text="${practica.idPractica}"></td>
                    <td th:text="${practica.titulo}"></td>
                    <td th:text="${practica.idEmpresa}"></td>
                    <td th:text="${practica.tipoPractica}"></td>
                    <td th:text="${practica.vigencia}"></td>
                    <td>
                        <a th:href="@{/admin/practicas/editar/{id}(id=${practica.idPractica})}" class="action-btn edit"><i class="fas fa-edit"></i></a>
                        <a th:href="@{/admin/practicas/eliminar/{id}(id=${practica.idPractica})}" class="action-btn delete"
                           onclick="return confirm('¿Eliminar esta práctica?')"><i class="fas fa-trash-alt"></i></a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(practicas)}">
                    <td colspan="6" style="text-align:center;">No hay prácticas registradas.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Configuración básica del documento -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Empresas</title>

    <!-- Vinculación de los estilos específicos para la interfaz del administrador -->
    <link rel="stylesheet" th:href="@{/Styles/dashboard-admin.css}">
    <!-- Enlace a la biblioteca de iconos Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<!-- Contenedor principal que organiza el sidebar y el contenido central -->
<div class="dashboard">

    <!-- Panel lateral (Sidebar): Menú de navegación fijo -->
    <aside class="sidebar">
        <!-- Contenedor del nombre de la marca/plataforma -->
        <div class="logo">
            <img th:src="@{/Images/INPRAX.png}">
        </div>
        <!-- Menú de navegación principal con iconos -->
        <nav>
            <ul>
                <!-- Lista de navegación: Redirigen a las diferentes secciones del sistema -->
                <li><a th:href="@{/admin/dashboard}"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a th:href="@{/estudiantes/estudiantes}"><i class="fas fa-user-graduate"></i> Estudiantes</a></li>
                <li><a th:href="@{/empresas/empresas}" class="active"><i class="fas fa-building"></i> Empresas</a></li> <!-- Clase 'active' para resaltar la página actual -->
                <li><a th:href="@{/admin/practicas}"><i class="fas fa-briefcase"></i> Prácticas</a></li>
                <li><a th:href="@{/admin/perfil}"><i class="fas fa-user"></i> Perfil</a></li>
                <!-- Enlace de cierre de sesión que redirige al inicio del sitio -->
                <li><a th:href="@{/logout}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Área de contenido principal: Donde se muestra la información dinámica -->
    <main class="main-content">
        <!-- Cabecera del panel: Título y botón de salida -->
        <header class="header">
            <h1>Gestión de Empresas</h1>
            <!-- Botón que redirige al login o página principal (Cierra la sesión) -->
            <a th:href="@{/logout}" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
        </header>

        <!-- Sección de accesos rápidos para la creación de nuevos registros -->
        <div style="display: flex; gap: 15px; align-items: right;">
          <div class="input-containerB" style="margin: 0;">
            <input type="text" id="buscar" placeholder="Buscar estudiante..." onkeyup="filtrarTabla()"/>
          </div>
        </div>
        
        <div class="actions">
            <a th:href="@{/empresas/empresas/nuevo}" class="btn"><i class="fas fa-plus"></i> Agregar Empresa</a>
        </div>

        <!-- Contenedor específico para la visualización de datos en formato de tabla -->
        <div class="table-container">
            <table class="table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Tipo de Empresa</th>
                    <th>Tamaño de Empresa</th>
                    <th>Teléfono</th>
                    <th>Correo</th>
                    <th>Direccion</th>
                    <th>Horario</th>
                    <th>Descripción</th>
                    <th>ID Login</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <!-- Fila de datos individual -->
                <tr th:each="empresas: ${empresas}">
                    <td th:text="${empresas.idEmpresa}">1</td>
                    <td th:text="${empresas.nombreEmpresa}"></td>
                    <td th:text="${empresas.tipoEmpresa}"></td>
                    <td th:text="${empresas.tamanoEmpresa}"></td>
                    <td th:text="${empresas.telefonoEmpresa}"></td>
                    <td th:text="${empresas.correoEmpresa}"></td>
                    <td th:text="${empresas.direccionEmpresa}"></td>
                    <td th:text="${empresas.horarioEmpresa}"></td>
                    <td th:text="${empresas.descripcion}"></td>
                    <td th:text="${empresas.idLogin}"></td>
                    <td>
                        
                        <!-- Botones de acción para gestionar la edición o eliminación del registro -->
                        <a
                      th:href="@{/empresas/empresas/editar/{id}(id=${empresas.idEmpresa})}"
                      class="action-btn edit"
                      ><i class="fas fa-edit"></i
                    ></a>
                    <a
                      th:href="@{/empresas/empresas/eliminar/{id}(id=${empresas.idEmpresa})}"
                      class="action-btn delete" onclick="return confirm('¿Estas seguro que quieres eliminar este registro?')"
                      ><i class="fas fa-trash-alt"></i
                    ></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>

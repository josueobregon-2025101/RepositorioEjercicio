<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Empresas</title>
    <link rel="stylesheet" th:href="@{/Styles/dashboard-admin.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="dashboard">
    <aside class="sidebar">
        <div class="logo"><img th:src="@{/Images/INPRAX.png}"></div>
        <nav><ul>
            <li><a th:href="@{/admin/dashboard}"><i class="fas fa-home"></i> Dashboard</a></li>
            <li><a th:href="@{/admin/estudiantes}"><i class="fas fa-user-graduate"></i> Estudiantes</a></li>
            <li><a th:href="@{/admin/empresas}" class="active"><i class="fas fa-building"></i> Empresas</a></li>
            <li><a th:href="@{/admin/practicas}"><i class="fas fa-briefcase"></i> Prácticas</a></li>
            <li><a th:href="@{/admin/perfil}"><i class="fas fa-user"></i> Perfil</a></li>
            <li><a th:href="@{/logout}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a></li>
        </ul></nav>
    </aside>
    <main class="main-content">
        <header class="header">
            <h1>Gestión de Empresas</h1>
            <a th:href="@{/logout}" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
        </header>
        <div class="actions">
            <a th:href="@{/empresas/nuevo}" class="btn"><i class="fas fa-plus"></i> Agregar Empresa</a>
        </div>
        <div class="table-container">
            <table class="table">
                <thead>
                <tr>
                    <th>ID</th><th>Nombre</th><th>Correo</th>
                    <th>Teléfono</th><th>Tipo</th><th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="empresa : ${empresas}">
                    <td th:text="${empresa.idEmpresa}"></td>
                    <td th:text="${empresa.nombreEmpresa}"></td>
                    <td th:text="${empresa.correoEmpresa}"></td>
                    <td th:text="${empresa.telefonoEmpresa}"></td>
                    <td th:text="${empresa.tipoEmpresa}"></td>
                    <td>
                        <a th:href="@{/empresas/editar/{id}(id=${empresa.idEmpresa})}" class="action-btn edit"><i class="fas fa-edit"></i></a>
                        <a th:href="@{/empresas/eliminar/{id}(id=${empresa.idEmpresa})}" class="action-btn delete"
                           onclick="return confirm('¿Eliminar esta empresa?')"><i class="fas fa-trash-alt"></i></a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(empresas)}">
                    <td colspan="6" style="text-align:center;">No hay empresas registradas.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>

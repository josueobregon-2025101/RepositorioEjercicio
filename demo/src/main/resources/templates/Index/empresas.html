<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Configuración básica del documento -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Empresas</title>

    <!-- Vinculación de los estilos específicos para la interfaz del administrador -->
    <link rel="stylesheet" th:href="@{/Styles/dashboard-admin.css}">
    <!-- Enlace a la biblioteca de iconos Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<!-- Contenedor principal que organiza el sidebar y el contenido central -->
<div class="dashboard">

    <!-- Panel lateral (Sidebar): Menú de navegación fijo -->
    <aside class="sidebar">
        <!-- Contenedor del nombre de la marca/plataforma -->
        <div class="logo">
            <img th:src="@{/Images/INPRAX.png}">
        </div>
        <!-- Menú de navegación principal con iconos -->
        <nav>
            <ul>
                <!-- Lista de navegación: Redirigen a las diferentes secciones del sistema -->
                <li><a th:href="@{/admin/dashboard}"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a th:href="@{/estudiantes/estudiantes}"><i class="fas fa-user-graduate"></i> Estudiantes</a></li>
                <li><a th:href="@{/empresas/empresas}" class="active"><i class="fas fa-building"></i> Empresas</a></li> <!-- Clase 'active' para resaltar la página actual -->
                <li><a th:href="@{/practicas/practicas}"><i class="fas fa-briefcase"></i> Prácticas</a></li>
                <li><a th:href="@{/admin/perfil}"><i class="fas fa-user"></i> Perfil</a></li>
                <!-- Enlace de cierre de sesión que redirige al inicio del sitio -->
                <li><a th:href="@{/logout}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Área de contenido principal: Donde se muestra la información dinámica -->
    <main class="main-content">
        <!-- Cabecera del panel: Título y botón de salida -->
        <header class="header">
            <h1>Gestión de Empresas</h1>
            <!-- Botón que redirige al login o página principal (Cierra la sesión) -->
            <a th:href="@{/logout}" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
        </header>

        <!-- Sección de accesos rápidos para la creación de nuevos registros -->
        <div style="display: flex; gap: 15px; align-items: right;">
          <div class="input-containerB" style="margin: 0;">
            <input type="text" id="buscar" placeholder="Buscar estudiante..." onkeyup="filtrarTabla()"/>
          </div>
        </div>
        
        <div class="actions">
            <a th:href="@{/empresas/empresas/nuevo}" class="btn"><i class="fas fa-plus"></i> Agregar Empresa</a>
        </div>

        <!-- Contenedor específico para la visualización de datos en formato de tabla -->
        <div class="table-container">
            <table class="table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Tipo de Empresa</th>
                    <th>Tamaño de Empresa</th>
                    <th>Teléfono</th>
                    <th>Correo</th>
                    <th>Direccion</th>
                    <th>Horario</th>
                    <th>Descripción</th>
                    <th>ID Login</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <!-- Fila de datos individual -->
                <tr th:each="empresas: ${empresas}">
                    <td th:text="${empresas.idEmpresa}">1</td>
                    <td th:text="${empresas.nombreEmpresa}"></td>
                    <td th:text="${empresas.tipoEmpresa}"></td>
                    <td th:text="${empresas.tamanoEmpresa}"></td>
                    <td th:text="${empresas.telefonoEmpresa}"></td>
                    <td th:text="${empresas.correoEmpresa}"></td>
                    <td th:text="${empresas.direccionEmpresa}"></td>
                    <td th:text="${empresas.horarioEmpresa}"></td>
                    <td th:text="${empresas.descripcion}"></td>
                    <td th:text="${empresas.idLogin}"></td>
                    <td>
                        
                        <!-- Botones de acción para gestionar la edición o eliminación del registro -->
                        <!--agregar el script para mostrar editar -->
                        <a href="#"
                         th:onclick="'editarActive(' + ${empresas.idEmpresa} + ');return false;'"
                      class="action-btn edit"
                      ><i class="fas fa-edit"></i
                    ></a>
                    <a
                      th:href="@{/empresas/empresas/eliminar/{id}(id=${empresas.idEmpresa})}"
                      class="action-btn delete" onclick="return confirm('¿Estas seguro que quieres eliminar este registro?')"
                      ><i class="fas fa-trash-alt"></i
                    ></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="editarInactivo" id="editarContainer">
            <form th:object="${empresa}" class="profile-form">
                <!-- Campos de entrada de datos para editar -->
                <div class="form-group">
                    <label for="idLogin">IDLogin:</label>
                    <input type="hidden" id="idLogin" th:field="*{idLogin}" >
                </div>
                <div class="form-group">
                    <label for="id">ID:</label>
                    <input type="text" id="id" th:field="*{idEmpresa}" readonly>
                </div>
                <div class="form-group">
                    <label for="nombre">Nombre de la empresa:</label>
                    <input type="text" id="nombre" th:field="*{nombreEmpresa}" placeholder="Ej: ACME S.A.">
                </div>
                <div class="form-group">
                    <label for="correo">Correo Empresa:</label>
                    <input type="email" id="correo" th:field="*{correoEmpresa}" placeholder="empresa@correo.com">
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" th:field="*{telefonoEmpresa}" placeholder="555-0000">
                </div>
                <div class="form-group">
                    <label for="sector">Sector de Empresa:</label>
                    <input type="text" id="sector" th:field="*{tipoEmpresa}" placeholder="Ej: Tecnología">
                </div>
                <div class="form-group">
                    <label for="sector">tamaño de Empresa:</label>
                    <input type="text" id="tamanio" th:field="*{tamanoEmpresa}" placeholder="Ej: Mediano">
                </div>
                <div class="form-group">
                    <label for="direction">direccion de empresa:</label>
                    <input type="text" id="direction" th:field="*{direccionEmpresa}" placeholder="11av, Ciudad Guatemala">
                </div>
                <div class="form-group">
                    <label for="sector">horario de empresa:</label>
                    <input type="text" id="horario" th:field="*{horarioEmpresa}" placeholder="Ej: Mediano">
                </div>
                <div class="form-group">
                    <label for="descripcion">descripcion:</label>
                    <input type="text" id="descripcion" th:field="*{descripcion}" placeholder="Empresa dedicada a...">
                </div>
                <!-- boton para cancelar editar-->
                <div class="form-actions">
                    <button type="button" class="btn-cancel" th:onclick="'editarInactive();'"><i class="fas fa-close"></i> Cancelar</button>
                </div>
                <!-- Botones de acción para gestionar la creación del editar -->
                <div class="form-actions">
                    <button type="button" class="btn" onclick="actualizarEmpresa()"><i class="fas fa-save" ></i> Editar</button>
                </div>
            </form>

        </div>
    </main>
</div>
<script th:src="@{/Scripts/empresa.js}"></script>
</body>
</html>

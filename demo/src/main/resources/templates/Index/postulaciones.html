<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">

<head>
    <!-- Configuración básica del documento -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis postulaciones - Inprax</title>

    <!-- Enlace a la hoja de estilos externa para el diseño visual -->
    <link rel="stylesheet" th:href="@{/Styles/postulaciones.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link id="favicon" rel="icon" href="/Images/PostulacionesIconAmarillo.png">

</head>
<script>
    (function () {
        const theme = localStorage.getItem("theme") || "theme-yellow"
        document.documentElement.classList.add(theme)
    })();
</script>
</head>

<body class="image-bg">

    <video id="bgvideo" autoplay muted loop playsinline></video>

    <!-- Contenedor principal que organiza el sidebar y el contenido central -->
    <div class="dashboard">

        <!-- Panel lateral (Sidebar): Menú de navegación fijo -->
        <aside class="sidebar">
            <div class="logo">
                <img id="logo" th:src="@{/Images/INPRAX.png}">
            </div>

            <!-- Lista de navegación: Redirigen a las diferentes secciones del sistema -->
            <nav>
                <ul>
                    <li>
                        <a th:href="@{/estudiantes/estudiantes/dashboard}">
                            <i class="fas fa-home"></i> Inicio
                        </a>
                    </li>

                    <li>
                        <a th:href="@{/practicas/estudiantes/practicas}">
                            <i class="fas fa-briefcase"></i> Prácticas disponibles
                        </a>
                    </li>

                    <li>
                        <a th:href="@{/api/postulaciones/postulaciones}" class="active">
                            <i class="fas fa-file"></i> Mis postulaciones
                        </a>
                    </li>

                    <li>
                        <a th:href="@{/documentos/documentos}">
                            <i class="fas fa-folder"></i> Mis documentos
                        </a>
                    </li>

                    <li>
                        <a th:href="@{/estudiantes/estudiantes/perfil}">
                            <i class="fas fa-user"></i> Perfil
                        </a>
                    </li>
                    <li>
                        <a th:href="@{/estudiantes/configuracion}">
                            <i class="fas fa-cog"></i> Configuración
                        </a>
                    </li>
                    <li><a th:href="@{/login/index}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Área de contenido principal: Donde se muestra la información dinámica -->
        <main class="main-content">

            <!-- Cabecera del panel: Título y botón de salida -->
            <header class="header">
                <h1>Mis postulaciones</h1>
                <!-- Botón que redirige al login o página principal (Cierra la sesión) -->
                <a th:href="@{/login/index}" class="logout-btn" style="text-decoration: none; display: inline-block;">
                    Cerrar sesión
                </a>
            </header>

            <!-- Contenedor específico para la gestión de información del usuario -->
            <div class="container">

                <!-- Rejilla de tarjetas (Cards) para el seguimiento de solicitudes -->
                <div class="postulaciones">

                    <!-- Tarjeta de acceso rápido con estado de postulación -->
                    <div class="cardPostulacion" th:each="post : ${postulaciones}">
                        <h3 th:text="${post.titulo}"></h3>
                        <p th:text="${post.descripcion}"></p>
                        <p>Fecha: <span th:text="${post.fechaPost}"></span></p>
                        <span class="estado-postulacion" th:classappend="
                                ${post.estado == 'Enviado' ? ' estado-enviado' :
                                post.estado == 'En revisión' ? ' estado-revision' :
                                post.estado == 'Aceptado' ? ' estado-aceptado' :
                                post.estado == 'Rechazado' ? ' estado-rechazado' : ''}" th:text="${post.estado}">
                        </span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script th:src="@{/Scripts/temas.js}"></script>
</body>

</html>

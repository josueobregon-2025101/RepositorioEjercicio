<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Empresa - Inprax</title>
    <link rel="stylesheet" th:href="@{/Styles/dashboard-admin.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link id="favicon" rel="icon" href="/Images/PerfilIconAmarillo.png">
    <script>
        (function () {
            const theme = localStorage.getItem("theme") || "theme-yellow";
            document.documentElement.classList.add(theme);
        })();
    </script>
</head>

<body class="image-bg">

<video id="bgvideo" autoplay muted loop playsinline></video>

<div class="dashboard">

    <aside class="sidebar">
        <div class="logo">
            <img id="logo" th:src="@{/Images/INPRAX.png}">
        </div>
        <nav>
            <ul>
                <li><a th:href="@{/empresa/dashboard}"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a th:href="@{/estudiantes/estudiantes}"><i class="fas fa-user-graduate"></i> Estudiantes</a></li>
                <li><a th:href="@{/practicas/practicas}"><i class="fas fa-briefcase"></i> Prácticas</a></li>
                <li><a th:href="@{/empresa/perfil}" class="active"><i class="fas fa-building"></i> Perfil</a></li>
                <li><a th:href="@{/empresa/configuracion}"><i class="fas fa-cog"></i> Configuración</a></li>
                <li><a th:href="@{/login/index}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a></li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">

        <header class="header">
            <h1>Perfil de la Empresa</h1>
            <a th:href="@{/login/index}" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
        </header>

        <!-- Mensaje de éxito o error -->
        <div th:if="${mensaje}" class="alert success" th:text="${mensaje}"></div>
        <div th:if="${error}"   class="alert error"   th:text="${error}"></div>

        <div class="profile-container">
            <div class="profile-card">
                <h2>Información de la Empresa</h2>

                <form th:action="@{/empresa/perfil/guardar}" method="post" class="profile-form">

                    <div class="form-group">
                        <label for="nombreEmpresa">Nombre de la empresa</label>
                        <input type="text" id="nombreEmpresa" name="nombreEmpresa"
                               th:value="${empresa != null ? empresa.nombreEmpresa : ''}">
                    </div>

                    <div class="form-group">
                        <label for="correoEmpresa">Correo empresarial</label>
                        <input type="email" id="correoEmpresa" name="correoEmpresa"
                               th:value="${empresa != null ? empresa.correoEmpresa : ''}">
                    </div>

                    <div class="form-group">
                        <label for="telefonoEmpresa">Teléfono</label>
                        <input type="text" id="telefonoEmpresa" name="telefonoEmpresa"
                               th:value="${empresa != null ? empresa.telefonoEmpresa : ''}">
                    </div>

                    <div class="form-group">
                        <label for="direccionEmpresa">Dirección</label>
                        <input type="text" id="direccionEmpresa" name="direccionEmpresa"
                               th:value="${empresa != null ? empresa.direccionEmpresa : ''}">
                    </div>

                    <div class="form-group">
                        <label for="tipoEmpresa">Tipo de empresa</label>
                        <input type="text" id="tipoEmpresa" name="tipoEmpresa"
                               th:value="${empresa != null ? empresa.tipoEmpresa : ''}">
                    </div>

                    <div class="form-group">
                        <label for="tamanoEmpresa">Tamaño</label>
                        <input type="text" id="tamanoEmpresa" name="tamanoEmpresa"
                               th:value="${empresa != null ? empresa.tamanoEmpresa : ''}">
                    </div>

                    <div class="form-group">
                        <label for="horarioEmpresa">Horario</label>
                        <input type="text" id="horarioEmpresa" name="horarioEmpresa"
                               th:value="${empresa != null ? empresa.horarioEmpresa : ''}">
                    </div>

                    <div class="form-group full">
                        <label for="descripcion">Descripción</label>
                        <textarea id="descripcion" name="descripcion" rows="4"
                                  th:text="${empresa != null ? empresa.descripcion : ''}"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn"><i class="fas fa-save"></i> Guardar Cambios</button>
                    </div>

                </form>
            </div>
        </div>

        <div class="theme-switcher">
            <button data-theme="theme-yellow">🟡</button>
            <button data-theme="theme-purple">🟣</button>
            <button data-theme="theme-cyan-dark">🔵</button>
            <button data-theme="theme-green-dark">🟢</button>
            <button data-theme="theme-blue-light">⚪</button>
        </div>

    </main>
</div>

<script th:src="@{/Scripts/temas.js}"></script>

</body>
</html>

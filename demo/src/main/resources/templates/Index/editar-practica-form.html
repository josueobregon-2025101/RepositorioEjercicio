<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Práctica - Inprax</title>

    <link rel="stylesheet" th:href="@{/Styles/dashboard-admin.css}">

    <link rel="stylesheet" th:href="@{/Styles/editar-practica-form.css}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script>
        (function () {
            const theme = localStorage.getItem("theme") || "theme-yellow"
            document.documentElement.classList.add(theme)
        })();
    </script>

</head>

<body class="image-bg">

    <video id="bgvideo" autoplay muted loop playsinline></video>


    <div class="dashboard">

        <aside class="sidebar">
            <div class="logo">
                <img id="logo" th:src="@{/Images/INPRAX.png}">
            </div>
            <nav>
                <ul>
                    <li><a th:href="@{/api/administradores/admin}"><i class="fas fa-home"></i> Dashboard</a></li>
                    <li><a th:href="@{/estudiantes/estudiantes}"><i class="fas fa-user-graduate"></i> Estudiantes</a>
                    </li>
                    <li><a th:href="@{/empresas/empresas}"><i class="fas fa-building"></i> Empresas</a></li>
                    <li><a th:href="@{/practicas/practicas}" class="active"><i class="fas fa-briefcase"></i>
                            Prácticas</a></li>
                    <li><a th:href="@{/api/administradores/perfil-admin}"><i class="fas fa-user"></i> Perfil</a></li>
                    <li>
                        <a th:href="@{/api/administradores/configuracion}">
                            <i class="fas fa-cog"></i> Configuración
                        </a>
                    </li>
                    <li><a th:href="@{/login/index}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">

            <header class="header">
                <h1>Editar Práctica</h1>
                <a th:href="@{/login/index}" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i> Cerrar sesión
                </a>
            </header>

            <div class="profile-container">
                <div class="profile-card">
                    <h2>Editar Práctica ID: <span th:text="${practica.idPractica}"></span></h2>

                    <div th:if="${message}" th:class="${messageType == 'success' ? 'alert success' : 'alert error'}"
                        th:text="${message}">
                    </div>

                    <form th:action="@{/practicas/actualizar/{id}(id=${practica.idPractica})}" method="post"
                        class="profile-form">

                        <div class="form-group">
                            <label for="idEmpresa">ID de la Empresa:*</label>
                            <input type="number" id="idEmpresa" name="idEmpresa" th:value="${practica.idEmpresa}"
                                required>
                        </div>

                        <div class="form-group">
                            <label for="titulo">Título de la Práctica:*</label>
                            <input type="text" id="titulo" name="titulo" th:value="${practica.titulo}" required
                                maxlength="60">
                        </div>

                        <div class="form-group">
                            <label for="tiempoPractica">Tiempo de Práctica:*</label>
                            <input type="text" id="tiempoPractica" name="tiempoPractica"
                                th:value="${practica.tiempoPractica}" required placeholder="YYYY-MM-DD HH:MM:SS">
                            <small>Formato: 2026-01-01 08:00:00</small>
                        </div>

                        <div class="form-group">
                            <label for="tipoPractica">Tipo de Práctica:*</label>
                            <select id="tipoPractica" name="tipoPractica" required>
                                <option value="Presencial" th:selected="${practica.tipoPractica == 'Presencial'}">
                                    Presencial</option>
                                <option value="Remota" th:selected="${practica.tipoPractica == 'Remota'}">Remota
                                </option>
                                <option value="Híbrida" th:selected="${practica.tipoPractica == 'Híbrida'}">Híbrida
                                </option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="carreraPractica">Carrera Destino:*</label>
                            <select id="carreraPractica" name="carreraPractica" required>
                                <option value="Informática" th:selected="${practica.carreraPractica == 'Informática'}">
                                    Informática</option>
                                <option value="Sistemas" th:selected="${practica.carreraPractica == 'Sistemas'}">
                                    Sistemas</option>
                                <option value="Redes" th:selected="${practica.carreraPractica == 'Redes'}">Redes
                                </option>
                                <option value="Computación" th:selected="${practica.carreraPractica == 'Computación'}">
                                    Computación</option>
                                <option value="Software" th:selected="${practica.carreraPractica == 'Software'}">
                                    Software</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="vigencia">Vigencia/Estado:*</label>
                            <select id="vigencia" name="vigencia" required>
                                <option value="Vigente" th:selected="${practica.vigencia == 'Vigente'}">Vigente</option>
                                <option value="Pendiente" th:selected="${practica.vigencia == 'Pendiente'}">Pendiente
                                </option>
                                <option value="Aprobado" th:selected="${practica.vigencia == 'Aprobado'}">Aprobado
                                </option>
                                <option value="Rechazado" th:selected="${practica.vigencia == 'Rechazado'}">Rechazado
                                </option>
                                <option value="Vencido" th:selected="${practica.vigencia == 'Vencido'}">Vencido</option>
                                <option value="Cancelado" th:selected="${practica.vigencia == 'Cancelado'}">Cancelado
                                </option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="disponibilidad">Disponibilidad:*</label>
                            <input type="text" id="disponibilidad" name="disponibilidad"
                                th:value="${practica.disponibilidad}" required maxlength="60">
                        </div>

                        <div class="form-group">
                            <label for="horario">Horario:*</label>
                            <input type="text" id="horario" name="horario" th:value="${practica.horario}" required
                                placeholder="YYYY-MM-DD HH:MM:SS">
                            <small>Formato: 2026-01-01 08:00:00</small>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Guardar Cambios
                            </button>
                            <a th:href="@{/practicas/practicas}" class="btn btn-cancel">
                                <i class="fas fa-times"></i> Cancelar
                            </a>
                        </div>

                    </form>
                </div>
            </div>
        </main>
    </div>

    <script th:src="@{/Scripts/temas.js}"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Configuración básica del documento -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Administrador</title>

    <!-- Vinculación de los estilos específicos para la interfaz del administrador -->
    <link rel="stylesheet" th:href="@{/Styles/dashboard-admin.css}">
    <!-- Enlace a la biblioteca de iconos Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<!-- Contenedor principal que organiza el sidebar y el contenido central -->
<div class="dashboard">

    <!-- Panel lateral (Sidebar): Menú de navegación fijo -->
    <aside class="sidebar">
        <!-- Contenedor del nombre de la marca/plataforma -->
        <div class="logo">
            <img th:src="@{/Images/INPRAX.png}">
        </div>
        <!-- Menú de navegación principal con iconos -->
        <nav>
            <ul>
                <!-- Lista de navegación: Redirigen a las diferentes secciones del sistema -->
                <li><a th:href="@{/admin/dashboard}"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a th:href="@{/admin/estudiantes}"><i class="fas fa-user-graduate"></i> Estudiantes</a></li>
                <li><a th:href="@{/admin/empresas}"><i class="fas fa-building"></i> Empresas</a></li>
                <li><a th:href="@{/admin/practicas}"><i class="fas fa-briefcase"></i> Prácticas</a></li>
                <li><a th:href="@{/admin/perfil}" class="active"><i class="fas fa-user"></i> Perfil</a></li> <!-- Clase 'active' para resaltar la página actual -->
                <!-- Enlace de cierre de sesión que redirige al inicio del sitio -->
                <li><a th:href="@{/logout}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Área de contenido principal: Donde se muestra la información dinámica -->
    <main class="main-content">
        <!-- Cabecera del panel: Título y botón de salida -->
        <header class="header">
            <h1>Perfil Administrador</h1>
            <!-- Botón que redirige al login o página principal (Cierra la sesión) -->
            <a th:href="@{/logout}" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
        </header>

        <!-- Contenedor específico para la gestión de información del usuario -->
        <div class="profile-container">
            <!-- Tarjeta que contiene el formulario de edición -->
            <div class="profile-card">
                <h2>Información Personal</h2>
                <!-- Formulario de acceso para la modificación de registros existentes -->
                <form th:action="@{/admin/perfil/guardar}" method="post" class="profile-form">
                    <!-- Campos de entrada de datos con valores preestablecidos para editar -->
                    <div class="form-group">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" value="Administrador">
                    </div>
                    <div class="form-group">
                        <label for="correo">Correo:</label>
                        <input type="email" id="correo" name="correo" value="admin@plataforma.com">
                    </div>
                    <div class="form-group">
                        <label for="telefono">Teléfono:</label>
                        <input type="tel" id="telefono" name="telefono" value="555-0000">
                    </div>
                    <!-- Campo de solo lectura para el nivel de privilegio -->
                    <div class="form-group">
                        <label for="rol">Rol:</label>
                        <input type="text" id="rol" name="rol" value="Administrador" readonly>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" name="password" value="123456">
                    </div>
                    <!-- Botones de acción para gestionar la actualización del registro -->
                    <div class="form-actions">
                        <button type="submit" class="btn"><i class="fas fa-save"></i> Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>

    </main>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderación de Prácticas</title>

    <link rel="stylesheet" th:href="@{/Styles/dashboard-admin.css}">
    <link rel="stylesheet" th:href="@{/Styles/practicas.css}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div id="loading-screen">
    <video autoplay muted playsinline id="loading-video">
        <source th:src="@{/videos/PracticasLoader.mp4}" type="video/mp4">
    </video>
</div>
<video autoplay muted loop playsinline id="bg-video">
    <source th:src="@{/videos/fondo.mp4}" type="video/mp4">
</video>

<div class="dashboard">

    <aside class="sidebar">
        <div class="logo">
            <img th:src="@{/Images/INPRAX.png}" alt="Logo INPRAX">
        </div>

        <nav>
            <ul>
                <li><a th:href="@{/api/administradores/admin}"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a th:href="@{/estudiantes/estudiantes}"><i class="fas fa-user-graduate"></i> Estudiantes</a></li>
                <li><a th:href="@{/empresas/empresas}"><i class="fas fa-building"></i> Empresas</a></li>
                <li><a th:href="@{/practicas/practicas}" class="active"><i class="fas fa-briefcase"></i> Prácticas</a></li>
                <li><a th:href="@{/api/administradores/perfil}"><i class="fas fa-user"></i> Perfil</a></li>
                <li><a th:href="@{/login/index}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a></li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">

        <header class="header">
            <h1>Moderación de Prácticas</h1>
            <a th:href="@{/login/index}" class="logout-btn">
                <i class="fas fa-sign-out-alt"></i> Cerrar sesión
            </a>
        </header>

        <div th:if="${message}"
             th:class="${messageType == 'success' ? 'alert success' : 'alert error'}"
             th:text="${message}">
        </div>

        <div class="actions">
            <a th:href="@{/practicas/agregar}" class="btn">
                <i class="fas fa-plus"></i> Agregar Práctica
            </a>
        </div>

        <div class="table-container">
            <table class="table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>ID Empresa</th>
                    <th>Tipo</th>
                    <th>Carrera</th>
                    <th>Estado</th>
                    <th>Disponibilidad</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="practica : ${practicas}">
                    <td th:text="${practica.idPractica}"></td>
                    <td th:text="${practica.titulo}"></td>
                    <td th:text="${practica.idEmpresa}"></td>
                    <td th:text="${practica.tipoPractica}"></td>
                    <td th:text="${practica.carreraPractica}"></td>

                    <td>
                        <span th:if="${practica.vigencia == 'Aprobado'}" class="status-badge approved">
                            <i class="fas fa-check-circle"></i> Aprobado
                        </span>
                        <span th:if="${practica.vigencia == 'Rechazado'}" class="status-badge rejected">
                            <i class="fas fa-times-circle"></i> Rechazado
                        </span>
                        <span th:if="${practica.vigencia == 'Vigente'}" class="status-badge active">
                            <i class="fas fa-check"></i> Vigente
                        </span>
                        <span th:if="${practica.vigencia == 'Pendiente'}" class="status-badge pending">
                            <i class="fas fa-hourglass-half"></i> Pendiente
                        </span>
                        <span th:unless="${practica.vigencia == 'Aprobado' or practica.vigencia == 'Rechazado' or practica.vigencia == 'Vigente' or practica.vigencia == 'Pendiente'}">
                            <span class="status-badge" th:text="${practica.vigencia}"></span>
                        </span>
                    </td>

                    <td th:text="${practica.disponibilidad}"></td>

                    <td>
                        <a th:href="@{/practicas/editar/{id}(id=${practica.idPractica})}" class="action-btn edit">
                            <i class="fas fa-edit"></i>
                        </a>

                        <form th:action="@{/practicas/aprobar/{id}(id=${practica.idPractica})}" method="post" style="display:inline;">
                            <button type="submit" class="action-btn accept" onclick="return confirm('¿Aprobar esta práctica?')">
                                <i class="fas fa-check"></i>
                            </button>
                        </form>

                        <form th:action="@{/practicas/rechazar/{id}(id=${practica.idPractica})}" method="post" style="display:inline;">
                            <button type="submit" class="action-btn reject" onclick="return confirm('¿Rechazar esta práctica?')">
                                <i class="fas fa-times"></i>
                            </button>
                        </form>

                        <form th:action="@{/practicas/eliminar/{id}(id=${practica.idPractica})}" method="post" style="display:inline;">
                            <button type="submit" class="action-btn delete" onclick="return confirm('¿Eliminar esta práctica permanentemente?')">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </form>
                    </td>

                </tr>
                </tbody>
            </table>
        </div>

    </main>
</div>
<script th:src="@{/Scripts/practicas.js}"></script>
</body>
</html>

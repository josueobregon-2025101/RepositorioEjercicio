<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Práctica</title>

    <link rel="stylesheet" th:href="@{/Styles/dashboard-admin.css}">

    <link rel="stylesheet" th:href="@{/Styles/agregar-practica.css}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script>
    (function() {
        const theme = localStorage.getItem("theme") || "theme-yellow"
        document.documentElement.classList.add(theme)
    })();
    </script>

</head>

<body>

<body class="image-bg">

    <video id="bgvideo" autoplay muted loop playsinline></video>

<div class="dashboard">

    <aside class="sidebar">
        <div class="logo">
            <img id="logo" th:src="@{/Images/INPRAX.png}">
        </div>
        <nav>
            <ul>
                <li><a th:href="@{/api/administradores/admin}"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a th:href="@{/estudiantes/estudiantes}"><i class="fas fa-user-graduate"></i> Estudiantes</a></li>
                <li><a th:href="@{/empresas/empresas}"><i class="fas fa-building"></i> Empresas</a></li>
                <li><a th:href="@{/practicas/practicas}" class="active"><i class="fas fa-briefcase"></i> Prácticas</a></li>
                <li><a th:href="@{/api/administradores/perfil}"><i class="fas fa-user"></i> Perfil</a></li>
                <li>
                    <a th:href="@{/api/administradores/configuracion}">
                        <i class="fas fa-cog"></i> Configuración
                    </a>
                </li>
                <li><a th:href="@{/login/index}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a></li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        <header class="header">
            <h1>Agregar Práctica</h1>
            <a th:href="@{/Index/login.html}" class="logout-btn">
                <i class="fas fa-sign-out-alt"></i> Cerrar sesión
            </a>
        </header>

        <div class="profile-container">
            <div class="profile-card">
                <h2>Nueva Práctica</h2>

                <div th:if="${message}"
                     th:class="${messageType == 'success' ? 'alert success' : 'alert error'}"
                     th:text="${message}">
                </div>

                <form th:action="@{/practicas/guardar}" method="post" class="profile-form">

                    <div class="form-group">
                        <label for="idEmpresa">ID de la Empresa:*</label>
                        <input type="number" id="idEmpresa" name="idEmpresa"
                               th:value="${practica != null ? practica.idEmpresa : ''}"
                               required placeholder="Ej: 1, 2, 3...">
                        <small>ID de la empresa que ofrece la práctica</small>
                    </div>

                    <div class="form-group">
                        <label for="titulo">Título de la Práctica:*</label>
                        <input type="text" id="titulo" name="titulo"
                               th:value="${practica != null ? practica.titulo : ''}"
                               required maxlength="60">
                    </div>

                    <div class="form-group">
                        <label for="tiempoPractica">Tiempo de Práctica:*</label>
                        <input type="datetime-local" id="tiempoPractica" name="tiempoPractica"
                               th:value="${practica != null ? practica.tiempoPractica : ''}"
                               required>
                        <small>Ej: 2026-01-01 08:00:00</small>
                    </div>

                    <div class="form-group">
                        <label for="tipoPractica">Tipo de Práctica:*</label>
                        <select id="tipoPractica" name="tipoPractica" required>
                            <option value="">Seleccione...</option>
                            <option value="Presencial">Presencial</option>
                            <option value="Remota">Remota</option>
                            <option value="Híbrida">Híbrida</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="carreraPractica">Carrera Destino:*</label>
                        <select id="carreraPractica" name="carreraPractica" required>
                            <option value="">Seleccione...</option>
                            <option value="Informática">Informática</option>
                            <option value="Sistemas">Sistemas</option>
                            <option value="Redes">Redes</option>
                            <option value="Computación">Computación</option>
                            <option value="Software">Software</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="vigencia">Vigencia:*</label>
                        <select id="vigencia" name="vigencia" required>
                            <option value="">Seleccione...</option>
                            <option value="Vigente">Vigente</option>
                            <option value="Pendiente">Pendiente</option>
                            <option value="Vencido">Vencido</option>
                            <option value="Cancelado">Cancelado</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="disponibilidad">Disponibilidad:*</label>
                        <input type="text" id="disponibilidad" name="disponibilidad"
                               th:value="${practica != null ? practica.disponibilidad : ''}"
                               required maxlength="60">
                    </div>

                    <div class="form-group">
                        <label for="horario">Horario:*</label>
                        <input type="datetime-local" id="horario" name="horario"
                               th:value="${practica != null ? practica.horario : ''}"
                               required>
                        <small>Ej: 2026-01-01 08:00:00</small>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Guardar Práctica
                        </button>
                        <a th:href="@{/practicas/practicas}" class="btn btn-secondary">
                            <i class="fas fa-times"></i> Cancelar
                        </a>
                    </div>

                </form>
            </div>
        </div>
    </main>
</div>

    <script th:src="@{/Scripts/temas.js}"></script>

</body>
</html>

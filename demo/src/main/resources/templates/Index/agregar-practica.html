<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Configuración básica del documento -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Práctica</title>

    <!-- Vinculación de los estilos específicos para la interfaz del administrador -->
    <link rel="stylesheet" th:href="@{/Styles/dashboard-admin.css}">
    <!-- Enlace a la biblioteca de iconos Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<!-- Contenedor principal que organiza el sidebar y el contenido central -->
<div class="dashboard">

    <!-- Panel lateral (Sidebar): Menú de navegación fijo -->
    <aside class="sidebar">
        <!-- Contenedor del nombre de la marca/plataforma -->
        <div class="logo">
            <img th:src="@{/Images/INPRAX.png}">
        </div>
        <!-- Menú de navegación principal con iconos -->
        <nav>
            <ul>
                <!-- Lista de navegación: Redirigen a las diferentes secciones del sistema -->
                <li><a th:href="@{/admin/dashboard}"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a th:href="@{/admin/estudiantes}"><i class="fas fa-user-graduate"></i> Estudiantes</a></li>
                <li><a th:href="@{/admin/empresas}"><i class="fas fa-building"></i> Empresas</a></li>
                <li><a th:href="@{/admin/practicas}" class="active"><i class="fas fa-briefcase"></i> Prácticas</a></li> <!-- Clase 'active' para resaltar la página actual -->
                <li><a th:href="@{/admin/perfil}"><i class="fas fa-user"></i> Perfil</a></li>
                <!-- Enlace de cierre de sesión que redirige al inicio del sitio -->
                <li><a th:href="@{/Index/login.html}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Área de contenido principal: Donde se muestra la información dinámica -->
    <main class="main-content">
        <!-- Cabecera del panel: Título y botón de salida -->
        <header class="header">
            <h1>Agregar Práctica</h1>
            <!-- Botón que redirige al login o página principal (Cierra la sesión) -->
            <a th:href="@{/Index/login.html}" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
        </header>

        <!-- Contenedor específico para la gestión de información del usuario -->
        <div class="profile-container">
            <!-- Tarjeta que contiene el formulario de registro -->
            <div class="profile-card">
                <h2>Nueva Práctica</h2>
                <!-- Formulario de acceso para el registro de nuevas oportunidades -->
                <form th:action="@{/admin/practicas/agregar}" method="post" th:object="${practica}">
                    <!-- Campos de entrada de datos para el usuario -->
                    <div class="form-group">
                        <label for="titulo">Título:</label>
                        <input type="text" id="titulo" name="titulo" placeholder="Ej: Práctica en Desarrollo Web">
                    </div>
                    <div class="form-group">
                        <label for="empresa">Empresa:</label>
                        <input type="text" id="empresa" name="empresa" placeholder="Ej: ACME S.A.">
                    </div>
                    <!-- Campos de área de texto para información extendida -->
                    <div class="form-group">
                        <label for="descripcion">Descripción:</label>
                        <textarea id="descripcion" name="descripcion" rows="4" placeholder="Descripción de la práctica"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="requisitos">Requisitos:</label>
                        <textarea id="requisitos" name="requisitos" rows="3" placeholder="Requisitos necesarios"></textarea>
                    </div>
                    <!-- Campos de fecha para vigencia de la práctica -->
                    <div class="form-group">
                        <label for="fecha_inicio">Fecha de Inicio:</label>
                        <input type="date" id="fecha_inicio" name="fecha_inicio">
                    </div>
                    <div class="form-group">
                        <label for="fecha_fin">Fecha de Fin:</label>
                        <input type="date" id="fecha_fin" name="fecha_fin">
                    </div>
                    <!-- Selector de perfil para clasificar la modalidad -->
                    <div class="form-group">
                        <label for="tipo">Tipo de Práctica:</label>
                        <select id="tipo" name="tipo">
                            <option value="">Seleccione...</option>
                            <option value="remota">Remota</option>
                            <option value="presencial">Presencial</option>
                            <option value="mixta">Mixta</option>
                        </select>
                    </div>
                    <!-- Botones de acción para gestionar la creación del registro -->
                    <div class="form-actions">
                        <button type="button" class="btn"><i class="fas fa-save"></i> Guardar Práctica</button>
                    </div>
                </form>
            </div>
        </div>

    </main>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <!-- Configuración básica del documento -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Estudiante</title>

    <!-- Vinculación de los estilos específicos para la interfaz del administrador -->
    <link rel="stylesheet" th:href="@{/Styles/dashboard-admin.css}">
    <!-- Enlace a la biblioteca de iconos Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div class="dashboard">

        <!-- Panel lateral (Sidebar): Menú de navegación fijo -->
        <aside class="sidebar">
            <!-- Contenedor del nombre de la marca/plataforma -->
            <div class="logo">
                <img th:src="@{/Images/INPRAX.png}">
            </div>
            <!-- Menú de navegación principal con iconos -->
            <nav>
                <ul>
                    <!-- Lista de navegación: Redirigen a las diferentes secciones del sistema -->
                    <li><a th:href="@{/estudiantes/estudiantes/dashboard}"><i class="fas fa-home"></i>
                            Dashboard</a></li>
                    <li><a th:href="@{/estudiantes/estudiantes}" class="active"><i class="fas fa-user-graduate"></i>
                            Estudiantes</a></li> <!-- Clase 'active' para resaltar la página actual -->
                    <li><a th:href="@{/empresas/empresas}"><i class="fas fa-building"></i> Empresas</a></li>
                    <li><a th:href="@{/practicas/practicas}"><i class="fas fa-briefcase"></i> Prácticas</a></li>
                    <li><a th:href="@{/perfil/perfil}"><i class="fas fa-user"></i> Perfil</a></li>
                    <!-- Enlace de cierre de sesión que redirige al inicio del sitio -->
                    <li><a th:href="@{logout}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Área de contenido principal: Donde se muestra la información dinámica -->
        <main class="main-content">
            <!-- Cabecera del panel: Título y botón de salida -->
            <header class="header">
                <h1>Editar Estudiante</h1>
                <!-- Botón que redirige al login o página principal (Cierra la sesión) -->
                <a th:href="@{logout}" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
            </header>

            <!-- Contenedor específico para la gestión de información del usuario -->
            <div class="profile-container">
                <!-- Tarjeta que contiene el formulario de edición -->
                <div class="profile-card">
                    <h2>Datos del Estudiante</h2>
                    <!-- Formulario de acceso para la modificación de registros existentes -->
                    <form id="formEditEstudiante" th:action="@{/estudiantes/estudiantes/guardar}"
                        th:object="${estudiantes}" method="post" class="profile-form">
                        <!-- Campos de entrada de datos con valores preestablecidos para editar -->

                        <div class="form-group">
                            <label for="id">Código (ID)</label>
                            <div class="input-container">
                                <i class="fas fa-hashtag"></i>
                                <input type="text" id="id" th:field="*{idestudiante}" class="readonly-input" readonly>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="institucion">Intitucion:</label>
                            <div class="input-container">
                                <select th:field="*{institucion}" required>
                                    <option value="">Selecciona una institucion</option>
                                    <option th:each="i : ${institucion}" th:value="${i.id}" th:text="${i.nombre}">
                                    </option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="idlogin">ID Login:</label>
                            <input type="number" id="idlogin" th:field="*{idlogin}" placeholder="Ej: 1">
                        </div>

                        <div class="form-group">
                            <label for="nombre">Nombre:</label>
                            <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ej: Juan">
                        </div>

                        <div class="form-group">
                            <label for="apellido">Apellido:</label>
                            <input type="text" id="apellido" th:field="*{apellido}" placeholder="Ej: Pérez">
                        </div>

                        <div class="form-group">
                            <label for="edad">Edad:</label>
                            <input type="text" id="edad" th:field="*{edad}" placeholder="Ej: 18">
                        </div>

                        <div class="form-group">
                            <label for="telefono">Telefono:</label>
                            <input type="text" id="telefono" th:field="*{telefono}" placeholder="Ej: 5469-8702">
                        </div>

                        <div class="form-group">
                            <label for="grado">Grado:</label>
                            <input type="text" id="grado" th:field="*{grado}" placeholder="Ej: 5to">
                        </div>

                        <div class="form-group">
                            <label for="carrera">Carrera:</label>
                            <input type="text" id="carrera" th:field="*{carrera}" placeholder="Ej: Informatica">
                        </div>

                        <div class="form-group">
                            <label for="correo">Correo:</label>
                            <input type="email" id="correo" th:field="*{correo}" placeholder="Ej: example@gmail.com">
                        </div>

                        <div class="form-group">
                            <label for="tutortel">Telefono del Tutor:</label>
                            <input type="text" id="tutortel" th:field="*{tutortel}" placeholder="Ej: 5469-8702">
                        </div>

                        <div class="form-group">
                            <label for="nombreInstitucion">Nombre de la Institución:</label>
                            <input type="text" id="nombreInstitucion" th:field="*{nombreInstitucion}"
                                placeholder="Ej: Instituto Nacional">
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn"><i class="fas fa-save"></i> Guardar Estudiante</button>
                            <a th:href="@{/api/Estudiantes/admin/estudiantes}" class="btn-cancel"><i
                                    class="fas fa-times"></i> Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>

        </main>
    </div>
</body>

</html>

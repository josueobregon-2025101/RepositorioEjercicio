<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <!-- Configuración básica del documento -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Estudiante</title>
    
    <!-- Vinculación de los estilos específicos para la interfaz del administrador -->
    <link rel="stylesheet" th:href="@{../Styles/dashboard-admin.css}">
    <!-- Enlace a la biblioteca de iconos Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <!-- Contenedor principal que organiza el sidebar y el contenido central -->
    <div class="dashboard">

        <!-- Panel lateral (Sidebar): Menú de navegación fijo -->
        <aside class="sidebar">
            <!-- Contenedor del nombre de la marca/plataforma -->
            <div class="logo">
                <img th:src="@{../Images/INPRAX.png}">
            </div>
            <!-- Menú de navegación principal con iconos -->
            <nav>
                <ul>
                    <!-- Lista de navegación: Redirigen a las diferentes secciones del sistema -->
                    <li><a th:href="@{/admin/dashboard}"><i class="fas fa-home"></i> Dashboard</a></li>
                    <li><a th:href="@{/admin/estudiantes}" class="active"><i class="fas fa-user-graduate"></i> Estudiantes</a></li> <!-- Clase 'active' para resaltar la página actual -->
                    <li><a th:href="@{/admin/empresas}"><i class="fas fa-building"></i> Empresas</a></li>
                    <li><a th:href="@{/admin/practicas}"><i class="fas fa-briefcase"></i> Prácticas</a></li>
                    <li><a th:href="@{/admin/perfil}"><i class="fas fa-user"></i> Perfil</a></li>
                    <!-- Enlace de cierre de sesión que redirige al inicio del sitio -->
                    <li><a th:href="@{logout}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Área de contenido principal: Donde se muestra la información dinámica -->
        <main class="main-content">
            <!-- Cabecera del panel: Título y botón de salida -->
            <header class="header">
                <h1>Agregar Estudiante</h1>
                <!-- Botón que redirige al login o página principal (Cierra la sesión) -->
                <a th:href="@{logout}" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
            </header>

            <!-- Contenedor específico para la gestión de información del usuario -->
            <div class="profile-container">
                <!-- Tarjeta que contiene el formulario de registro -->
                <div class="profile-card">
                    <h2>Nuevo Estudiante</h2>
                    <!-- Formulario de acceso para el registro de nuevos estudiantes -->
                    <form action="#" method="post" class="profile-form">
                        <!-- Campos de entrada de datos para el usuario -->
                        <div class="form-group">
                            <label for="nombre">Nombre completo:</label>
                            <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez">
                        </div>
                        <div class="form-group">
                            <label for="correo">Correo:</label>
                            <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com">
                        </div>
                        <div class="form-group">
                            <label for="telefono">Teléfono:</label>
                            <input type="tel" id="telefono" name="telefono" placeholder="555-0000">
                        </div>
                        <div class="form-group">
                            <label for="carrera">Carrera:</label>
                            <input type="text" id="carrera" name="carrera" placeholder="Ej: Ingeniería en Sistemas">
                        </div>
                        <div class="form-group">
                            <label for="password">Contraseña:</label>
                            <input type="password" id="password" name="password" placeholder="********">
                        </div>
                        <!-- Botones de acción para gestionar la creación del registro -->
                        <div class="form-actions">
                            <button type="button" class="btn"><i class="fas fa-save"></i> Guardar Estudiante</button>
                        </div>
                    </form>
                </div>
            </div>

        </main>
    </div>
</body>
</html>

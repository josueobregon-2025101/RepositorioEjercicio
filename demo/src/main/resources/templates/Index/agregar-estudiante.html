<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Estudiante</title>
    <link rel="stylesheet" th:href="@{/Styles/dashboard-admin.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="dashboard">
    <aside class="sidebar">
        <div class="logo"><img th:src="@{/Images/INPRAX.png}" alt="INPRAX"></div>
        <nav><ul>
            <li><a th:href="@{/admin/dashboard}"><i class="fas fa-home"></i> Dashboard</a></li>
            <li><a th:href="@{/admin/estudiantes}" class="active"><i class="fas fa-user-graduate"></i> Estudiantes</a></li>
            <li><a th:href="@{/admin/empresas}"><i class="fas fa-building"></i> Empresas</a></li>
            <li><a th:href="@{/admin/practicas}"><i class="fas fa-briefcase"></i> Prácticas</a></li>
            <li><a th:href="@{/admin/perfil}"><i class="fas fa-user"></i> Perfil</a></li>
            <li><a th:href="@{/logout}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a></li>
        </ul></nav>
    </aside>
    <main class="main-content">
        <header class="header">
            <h1>Agregar Estudiante</h1>
            <a th:href="@{/logout}" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
        </header>
        <div class="profile-container">
            <div class="profile-card">
                <h2>Nuevo Estudiante</h2>
                <form th:action="@{/estudiantes/guardar}" method="post" class="profile-form">
                    <div class="form-group">
                        <label>Nombre:</label>
                        <input type="text" name="nombre" placeholder="Ej: Juan" required>
                    </div>
                    <div class="form-group">
                        <label>Apellido:</label>
                        <input type="text" name="apellido" placeholder="Ej: Pérez" required>
                    </div>
                    <div class="form-group">
                        <label>Correo:</label>
                        <input type="email" name="correo" placeholder="ejemplo@correo.com" required>
                    </div>
                    <div class="form-group">
                        <label>Teléfono:</label>
                        <input type="text" name="telefono" placeholder="555-0000" required>
                    </div>
                    <div class="form-group">
                        <label>Grado:</label>
                        <input type="text" name="grado" placeholder="Ej: 5to Bach" required>
                    </div>
                    <div class="form-group">
                        <label>Carrera:</label>
                        <input type="text" name="carrera" placeholder="Ej: Informática" required>
                    </div>
                    <div class="form-group">
                        <label>Nombre institución:</label>
                        <input type="text" name="nombreInstitucion" placeholder="Ej: USAC" required>
                    </div>
                    <div class="form-group">
                        <label>Teléfono tutor:</label>
                        <input type="text" name="tutortel" placeholder="555-0001" required>
                    </div>
                    <div class="form-group">
                        <label>Edad:</label>
                        <input type="number" name="edad" placeholder="18" required>
                    </div>
                    <div class="form-group">
                        <label>Institución:</label>
                        <select name="institucion.id" required>
                            <option value="" disabled selected>Selecciona una institución</option>
                            <option th:each="inst : ${institucion}"
                                    th:value="${inst.id}"
                                    th:text="${inst.nombre}"></option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn"><i class="fas fa-save"></i> Guardar Estudiante</button>
                        <a th:href="@{/admin/estudiantes}" class="btn" style="background:#6c757d;">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta - INPRAX</title>
  <link rel="stylesheet" th:href="@{/Styles/register.css}">
</head>
<body>
<div class="background"></div>
<div class="container">
  <div class="register-box">
    <div class="logo">
      <img th:src="@{/Images/INPRAX.png}" alt="INPRAX">
    </div>
    <h2>Crear Cuenta</h2>

    <p th:if="${error}" th:text="${error}" style="color:red;text-align:center;"></p>

    <form th:action="@{/register}" method="post" id="register-form">
      <input type="email"    name="correoLogin"     placeholder="Correo electrónico" required>
      <input type="text"     name="usuarioLogin"    placeholder="Usuario" required>
      <input type="password" name="contrasenaLogin" placeholder="Contraseña" required>
      <select name="roles" required>
        <option value="" disabled selected>Selecciona tu rol</option>
        <option value="Estudiante">Estudiante</option>
        <option value="Empresa">Empresa</option>
      </select>
      <button type="submit">Registrarme</button>
    </form>

    <p class="login-link">
      ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a>
    </p>
  </div>
</div>
<footer class="footer">
  <div class="footer-content">
    <p>© 2026 INPRAX - Plataforma de prácticas profesionales</p>
  </div>
</footer>
</body>
</html>

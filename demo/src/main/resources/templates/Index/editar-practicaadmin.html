<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Práctica</title>

    <!-- Vinculación de los estilos específicos para la interfaz del administrador -->
    <link rel="stylesheet" th:href="@{/Styles/dashboard-admin.css}">
    <!-- Enlace a la biblioteca de iconos Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="dashboard">

    <!-- Panel lateral (Sidebar): Menú de navegación fijo -->
    <aside class="sidebar">
        <div class="logo">
            <img th:src="@{/Images/INPRAX.png}" alt="Logo INPRAX">
        </div>
        <nav>
            <ul>
                <li><a th:href="@{/api/administradores/admin}"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a th:href="@{/estudiantes/estudiantes}"><i class="fas fa-user-graduate"></i> Estudiantes</a></li>
                <li><a th:href="@{/empresas/empresas}"><i class="fas fa-building"></i> Empresas</a></li>
                <li><a th:href="@{/practicas/practicas}" class="active"><i class="fas fa-briefcase"></i> Prácticas</a></li>
                <li><a th:href="@{/api/administradores/perfil-admin}"><i class="fas fa-user"></i> Perfil</a></li>
                <li><a th:href="@{/login/index}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a></li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        <header class="header">
            <h1>Editar Práctica</h1>
            <a th:href="@{/login/index}" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
        </header>

        <div class="profile-container">
            <div class="profile-card">
                <h2>Detalles de la Práctica</h2>
                <!-- Formulario con Thymeleaf -->
                <form th:action="@{/practicas/editar}" th:object="${practica}" method="post" class="profile-form">
                    <div class="form-group">
                        <label for="titulo">Título de la práctica:</label>
                        <input type="text" id="titulo" th:field="*{titulo}">
                    </div>
                    <div class="form-group">
                        <label for="empresa">Empresa:</label>
                        <input type="text" id="empresa" th:field="*{empresa}">
                    </div>
                    <div class="form-group">
                        <label for="estudiante">Estudiante asignado:</label>
                        <input type="text" id="estudiante" th:field="*{estudiante}">
                    </div>
                    <div class="form-group">
                        <label for="descripcion">Descripción:</label>
                        <textarea id="descripcion" th:field="*{descripcion}" rows="5"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="estado">Estado:</label>
                        <select id="estado" th:field="*{estado}">
                            <option value="Pendiente">Pendiente</option>
                            <option value="Aprobada">Aprobada</option>
                            <option value="Rechazada">Rechazada</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn"><i class="fas fa-save"></i> Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>

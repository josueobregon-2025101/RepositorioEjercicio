<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Práctica</title>
    <link rel="stylesheet" th:href="@{/Styles/dashboard-admin.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="dashboard">
    <aside class="sidebar">
        <div class="logo">
            <img th:src="@{/Images/INPRAX.png}">
        </div>
        <nav>
            <ul>
                <li><a th:href="@{/admin/dashboard}"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a th:href="@{/admin/estudiantes}"><i class="fas fa-user-graduate"></i> Estudiantes</a></li>
                <li><a th:href="@{/admin/empresas}"><i class="fas fa-building"></i> Empresas</a></li>
                <li><a th:href="@{/admin/practicas}" class="active"><i class="fas fa-briefcase"></i> Prácticas</a></li>
                <li><a th:href="@{/admin/perfil}"><i class="fas fa-user"></i> Perfil</a></li>
                <li><a th:href="@{/logout}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a></li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        <header class="header">
            <h1>Editar Práctica</h1>
            <a th:href="@{/logout}" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
        </header>

        <div class="profile-container">
            <div class="profile-card">
                <h2>Detalles de la Práctica</h2>
                <form th:action="@{/admin/practicas/editar/{id}(id=${practica.idPractica})}"
                      th:object="${practica}" method="post" class="profile-form">

                    <div class="form-group">
                        <label for="titulo">Título de la práctica:</label>
                        <input type="text" id="titulo" name="titulo" th:value="${practica.titulo}">
                    </div>
                    <div class="form-group">
                        <label for="tipoPractica">Tipo de práctica:</label>
                        <input type="text" id="tipoPractica" name="tipoPractica" th:value="${practica.tipoPractica}">
                    </div>
                    <div class="form-group">
                        <label for="carreraPractica">Carrera:</label>
                        <input type="text" id="carreraPractica" name="carreraPractica" th:value="${practica.carreraPractica}">
                    </div>
                    <div class="form-group">
                        <label for="tiempoPractica">Duración:</label>
                        <input type="text" id="tiempoPractica" name="tiempoPractica" th:value="${practica.tiempoPractica}">
                    </div>
                    <div class="form-group">
                        <label for="horario">Horario:</label>
                        <input type="text" id="horario" name="horario" th:value="${practica.horario}">
                    </div>
                    <div class="form-group">
                        <label for="disponibilidad">Disponibilidad:</label>
                        <input type="text" id="disponibilidad" name="disponibilidad" th:value="${practica.disponibilidad}">
                    </div>
                    <div class="form-group">
                        <label for="vigencia">Vigencia:</label>
                        <input type="text" id="vigencia" name="vigencia" th:value="${practica.vigencia}">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn"><i class="fas fa-save"></i> Guardar Cambios</button>
                        <a th:href="@{/admin/practicas}" class="btn" style="background:#6c757d;">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>

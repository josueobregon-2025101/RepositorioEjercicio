<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Empresa</title>
    <link rel="stylesheet" th:href="@{/Styles/dashboard-admin.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="dashboard">
    <aside class="sidebar">
        <div class="logo"><img th:src="@{/Images/INPRAX.png}" alt="INPRAX"></div>
        <nav><ul>
            <li><a th:href="@{/admin/dashboard}"><i class="fas fa-home"></i> Dashboard</a></li>
            <li><a th:href="@{/admin/estudiantes}"><i class="fas fa-user-graduate"></i> Estudiantes</a></li>
            <li><a th:href="@{/admin/empresas}" class="active"><i class="fas fa-building"></i> Empresas</a></li>
            <li><a th:href="@{/admin/practicas}"><i class="fas fa-briefcase"></i> Prácticas</a></li>
            <li><a th:href="@{/admin/perfil}"><i class="fas fa-user"></i> Perfil</a></li>
            <li><a th:href="@{/logout}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a></li>
        </ul></nav>
    </aside>
    <main class="main-content">
        <header class="header">
            <h1>Agregar Empresa</h1>
            <a th:href="@{/logout}" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
        </header>
        <div class="profile-container">
            <div class="profile-card">
                <h2>Nueva Empresa</h2>
                <p th:if="${error}" th:text="${error}" style="color:red;"></p>
                <form th:action="@{/empresas/guardar}" method="post" class="profile-form">
                    <div class="form-group">
                        <label>Nombre de la empresa:</label>
                        <input type="text" name="nombreEmpresa" placeholder="Ej: ACME S.A." required>
                    </div>
                    <div class="form-group">
                        <label>Tipo de empresa:</label>
                        <input type="text" name="tipoEmpresa" placeholder="Ej: Tecnología">
                    </div>
                    <div class="form-group">
                        <label>Correo de la empresa:</label>
                        <input type="email" name="correoEmpresa" placeholder="empresa@correo.com">
                    </div>
                    <div class="form-group">
                        <label>Teléfono:</label>
                        <input type="tel" name="telefonoEmpresa" placeholder="555-0000">
                    </div>
                    <div class="form-group">
                        <label>Dirección:</label>
                        <input type="text" name="direccionEmpresa" placeholder="Ej: Zona 10, Guatemala">
                    </div>
                    <div class="form-group">
                        <label>Tamaño de empresa:</label>
                        <input type="text" name="tamanoEmpresa" placeholder="Ej: Grande, Mediana, Pequeña">
                    </div>
                    <div class="form-group">
                        <label>Horario:</label>
                        <input type="text" name="horarioEmpresa" placeholder="Ej: 8AM-5PM">
                    </div>
                    <div class="form-group">
                        <label>Descripción:</label>
                        <input type="text" name="descripcion" placeholder="Ej: Empresa de tecnología">
                    </div>

                    <hr style="margin:16px 0;">
                    <h3>Credenciales de acceso</h3>

                    <div class="form-group">
                        <label>Correo de login:</label>
                        <input type="email" name="correoLogin" placeholder="login@correo.com" required>
                    </div>
                    <div class="form-group">
                        <label>Usuario:</label>
                        <input type="text" name="usuarioLogin" placeholder="usuario123" required>
                    </div>
                    <div class="form-group">
                        <label>Contraseña:</label>
                        <input type="password" name="contrasenaLogin" placeholder="********" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn"><i class="fas fa-save"></i> Guardar Empresa</button>
                        <a th:href="@{/admin/empresas}" class="btn" style="background:#6c757d;">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>

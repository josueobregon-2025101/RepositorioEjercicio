<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Configuración básica del documento -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Empresa</title>

    <!-- Vinculación de los estilos específicos para la interfaz del administrador -->
    <link rel="stylesheet" th:href="@{/Styles/dashboard-admin.css}">
    <!-- Enlace a la biblioteca de iconos Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script>
    (function() {
        const theme = localStorage.getItem("theme") || "theme-yellow"
        document.documentElement.classList.add(theme)
    })();
    </script>
</head>
<body>
<!-- Contenedor principal que organiza el sidebar y el contenido central -->
<div class="dashboard">

    <!-- Panel lateral (Sidebar): Menú de navegación fijo -->
    <aside class="sidebar">
        <!-- Contenedor del nombre de la marca/plataforma -->
        <div class="logo">
            <img th:src="@{/Images/INPRAX.png}" alt="INPRAX">
        </div>
        <!-- Menú de navegación principal con iconos -->
        <nav>
            <ul>
                <!-- Lista de navegación: Redirigen a las diferentes secciones del sistema -->
                <li><a th:href="@{/admin/dashboard}"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a th:href="@{/estudiantes/estudiantes}"><i class="fas fa-user-graduate"></i> Estudiantes</a></li>
                <li><a th:href="@{/empresas/empresas}" class="active"><i class="fas fa-building"></i> Empresas</a></li> <!-- Clase 'active' para resaltar la página actual -->
                <li><a th:href="@{/practicas/practicas}"><i class="fas fa-briefcase"></i> Prácticas</a></li>
                <li><a th:href="@{/perfil/perfil}"><i class="fas fa-user"></i> Perfil</a></li>
                <!-- Enlace de cierre de sesión que redirige al inicio del sitio -->
                <li><a th:href="@{/login/index}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Área de contenido principal: Donde se muestra la información dinámica -->
    <main class="main-content">
        <!-- Cabecera del panel: Título y botón de salida -->
        <header class="header">
            <h1>Agregar Empresa</h1>
            <!-- Botón que redirige al login o página principal (Cierra la sesión) -->
            <a th:href="@{/login/index}" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
        </header>

        <!-- Contenedor específico para la gestión de información del usuario -->
        <div class="profile-container">
            <!-- Tarjeta que contiene el formulario de registro -->
            <div class="profile-card">
                <h2>Nueva Empresa</h2>
                <div th:if="${error}" style="color:yellow;">
                    <p th:text="${error}"></p>
                </div>
                <!-- Formulario de acceso para el registro de nuevas empresas -->
                <form th:action="@{/empresas/guardar}" th:object="${empresaDTO}" method="post" class="profile-form">
                    <!-- Campos de entrada de datos para el usuario -->
                    <div class="form-group">
                        <label for="sector">Nombre de Usuario:</label>
                        <input type="text" id="user" th:field="*{usuarioLogin}" placeholder="Ej: ACMEUSER">
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" th:field="*{contrasenaLogin}" placeholder="********">
                    </div>
                    <div class="form-group">
                        <label for="nombre">Nombre de la empresa:</label>
                        <input type="text" id="nombre" th:field="*{nombreEmpresa}" placeholder="Ej: ACME S.A.">
                    </div>
                    <div class="form-group">
                        <label for="correo">Correo:</label>
                        <input type="email" id="correo" th:field="*{correoLogin}" placeholder="empresa@correo.com">
                    </div>
                    <div class="form-group">
                        <label for="correo">Correo Empresa:</label>
                        <input type="email" id="correoE" th:field="*{correoEmpresa}" placeholder="empresa@correo.com">
                    </div>
                    <div class="form-group">
                        <label for="telefono">Teléfono:</label>
                        <input type="tel" id="telefono" th:field="*{telefonoEmpresa}" placeholder="555-0000">
                    </div>
                    <div class="form-group">
                        <label for="sector">Sector de Empresa:</label>
                        <input type="text" id="sector" th:field="*{tipoEmpresa}" placeholder="Ej: Tecnología">
                    </div>
                    <!-- Botones de acción para gestionar la creación del registro -->
                    <div class="form-actions">
                        <button type="submit" class="btn"><i class="fas fa-save"></i> Guardar Empresa</button>
                    </div>
                </form>
            </div>
        </div>

    </main>
</div>

    <script th:src="@{/Scripts/temas.js}"></script>

</body>
</html>

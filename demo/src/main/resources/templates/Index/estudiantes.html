<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Estudiantes</title>
    <link rel="stylesheet" th:href="@{/Styles/dashboard-admin.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="dashboard">
    <aside class="sidebar">
        <div class="logo"><img th:src="@{/Images/INPRAX.png}"></div>
        <nav><ul>
            <li><a th:href="@{/admin/dashboard}"><i class="fas fa-home"></i> Dashboard</a></li>
            <li><a th:href="@{/admin/estudiantes}" class="active"><i class="fas fa-user-graduate"></i> Estudiantes</a></li>
            <li><a th:href="@{/admin/empresas}"><i class="fas fa-building"></i> Empresas</a></li>
            <li><a th:href="@{/admin/practicas}"><i class="fas fa-briefcase"></i> Prácticas</a></li>
            <li><a th:href="@{/admin/perfil}"><i class="fas fa-user"></i> Perfil</a></li>
            <li><a th:href="@{/logout}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a></li>
        </ul></nav>
    </aside>
    <main class="main-content">
        <header class="header">
            <h1>Gestión de Estudiantes</h1>
            <a th:href="@{/logout}" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
        </header>
        <div class="actions">
            <a th:href="@{/estudiantes/nuevo}" class="btn"><i class="fas fa-plus"></i> Agregar Estudiante</a>
        </div>
        <div class="table-container">
            <table class="table">
                <thead>
                <tr>
                    <th>ID</th><th>Nombre</th><th>Apellido</th>
                    <th>Correo</th><th>Carrera</th><th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="est : ${estudiantes}">
                    <td th:text="${est.idestudiante}"></td>
                    <td th:text="${est.nombre}"></td>
                    <td th:text="${est.apellido}"></td>
                    <td th:text="${est.correo}"></td>
                    <td th:text="${est.carrera}"></td>
                    <td>
                        <a th:href="@{/estudiantes/editar/{id}(id=${est.idestudiante})}" class="action-btn edit"><i class="fas fa-edit"></i></a>
                        <a th:href="@{/estudiantes/eliminar/{id}(id=${est.idestudiante})}" class="action-btn delete"
                           onclick="return confirm('¿Eliminar este estudiante?')"><i class="fas fa-trash-alt"></i></a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(estudiantes)}">
                    <td colspan="6" style="text-align:center;">No hay estudiantes registrados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
